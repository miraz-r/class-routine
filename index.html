<!doctype html>
<html lang="en">
  <head>
    <!-- =========================================
        BASIC SETTINGS
    ========================================== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <title>BBA Class Routine | Autumn 2026</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- =========================================
        MAIN CONTAINER
    ========================================== -->
    <div class="container">
      <!-- =====================================
            HEADER
        ====================================== -->
      <header class="header">
        <div class="header-left">
          <h1>Class Routine</h1>

          <p class="semester">
            Autumn 2026
            <br />
            Section B • Batch 61<sup>st</sup>
          </p>
        </div>

        <button id="themeToggle" class="theme-button">
          <!-- Moon -->
          <svg
            class="theme-icon moon-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
          </svg>

          <!-- Sun -->
          <svg
            class="theme-icon sun-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
        </button>
      </header>

      <!-- Calendar Button -->
      <button id="calendarButton" class="calendar-button">
        <!-- Calendar Icon -->
        <svg
          class="calendar-icon"
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          viewBox="0 0 24 24"
        >
          <rect x="3" y="4" width="18" height="18" rx="3"></rect>

          <line x1="8" y1="2.5" x2="8" y2="6"></line>
          <line x1="16" y1="2.5" x2="16" y2="6"></line>

          <line x1="3" y1="9" x2="21" y2="9"></line>
        </svg>

        <span id="selectedDate"> Tuesday, 4 August 2026 </span>
      </button>

      <!-- =====================================
            ROUTINE
        ====================================== -->

      <main>
        <!-- Mobile Day Picker -->
        <div class="mobile-day-picker">
          <button class="day-pill active" data-day="Sunday">Sunday</button>

          <button class="day-pill" data-day="Monday">Monday</button>

          <button class="day-pill" data-day="Tuesday">Tuesday</button>

          <button class="day-pill" data-day="Wednesday">Wednesday</button>

          <button class="day-pill" data-day="Thursday">Thursday</button>
        </div>
        <!-- Routine Grid -->
        <section class="routine-grid">
          <!-- Sunday -->
          <div class="day-column">
            <div class="day-header">
              <h2>Sunday</h2>
            </div>

            <div id="Sunday" class="day-cards"></div>
          </div>

          <!-- Monday -->
          <div class="day-column">
            <div class="day-header">
              <h2>Monday</h2>
            </div>

            <div id="Monday" class="day-cards"></div>
          </div>

          <!-- Tuesday -->
          <div class="day-column">
            <div class="day-header">
              <h2>Tuesday</h2>
            </div>

            <div id="Tuesday" class="day-cards"></div>
          </div>

          <!-- Wednesday -->
          <div class="day-column">
            <div class="day-header">
              <h2>Wednesday</h2>
            </div>

            <div id="Wednesday" class="day-cards"></div>
          </div>

          <!-- Thursday -->
          <div class="day-column">
            <div class="day-header">
              <h2>Thursday</h2>
            </div>

            <div id="Thursday" class="day-cards"></div>
          </div>
        </section>
        <!-- =====================================
      EMPTY STATE
===================================== -->

        <section id="emptyState" class="empty-state">
          <div class="empty-card">
            <svg
              class="empty-icon"
              xmlns="http://www.w3.org/2000/svg"
              width="56"
              height="56"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              viewBox="0 0 24 24"
            >
              <rect x="3" y="4" width="18" height="18" rx="3"></rect>
              <line x1="8" y1="2.5" x2="8" y2="6"></line>
              <line x1="16" y1="2.5" x2="16" y2="6"></line>
              <line x1="3" y1="9" x2="21" y2="9"></line>
              <path d="M8 14h8"></path>
            </svg>

            <h2>No Classes Today</h2>

            <p id="emptyDate"></p>

            <span>Enjoy your weekend.</span>
          </div>
        </section>
      </main>
    </div>

    <!-- =========================================
        CARD TEMPLATE
    ========================================== -->

    <template id="classCardTemplate">
      <article class="class-card">
        <!-- Time -->
        <div class="card-time">
          <!-- Clock -->
          <svg
            class="icon"
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <circle cx="12" cy="12" r="9" />
            <polyline points="12 7 12 12 15.5 14" />
          </svg>

          <span class="time"> 11:10 AM - 12:00 PM </span>
        </div>

        <!-- Subject -->

        <h3 class="subject">Subject</h3>

        <!-- Information -->

        <div class="card-info">
          <div class="info-row">
            <!-- Book -->
            <svg
              class="icon"
              xmlns="http://www.w3.org/2000/svg"
              width="17"
              height="17"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path d="M4 19.5A2.5 2.5 0 016.5 17H20" />
              <path
                d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5V4.5A2.5 2.5 0 016.5 2z"
              />
            </svg>

            <span class="course-code"></span>
          </div>

          <div class="info-row">
            <!-- Teacher -->
            <svg
              class="icon"
              xmlns="http://www.w3.org/2000/svg"
              width="17"
              height="17"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path d="M22 10v6M2 10v6" />
              <path d="M12 3L2 8l10 5 10-5-10-5z" />
              <path d="M6 12v5c0 1.5 3 3 6 3s6-1.5 6-3v-5" />
            </svg>

            <span class="teacher"></span>
          </div>

          <div class="info-row">
            <!-- Location -->
            <svg
              class="icon"
              xmlns="http://www.w3.org/2000/svg"
              width="17"
              height="17"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path d="M12 21s-6-5.3-6-11a6 6 0 1112 0c0 5.7-6 11-6 11z" />
              <circle cx="12" cy="10" r="2" />
            </svg>

            <span class="room"></span>
          </div>
        </div>
      </article>
    </template>

    <!-- JavaScript -->
    <!-- Calendar Modal -->

    <div id="calendarModal" class="calendar-modal">
      <div class="calendar-box">
        <div class="calendar-top">
          <button id="prevMonth">←</button>

          <h3 id="monthYear"></h3>

          <button id="nextMonth">→</button>
        </div>

        <div class="calendar-weekdays">
          <span>Su</span>
          <span>Mo</span>
          <span>Tu</span>
          <span>We</span>
          <span>Th</span>
          <span>Fr</span>
          <span>Sa</span>
        </div>

        <div id="calendarDays" class="calendar-days"></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
